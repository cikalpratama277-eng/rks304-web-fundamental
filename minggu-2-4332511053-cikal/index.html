<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans antialiased text-slate-100">
  <div class="w-full max-w-md">
    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500 text-slate-900 font-black text-2xl shadow-lg shadow-emerald-500/30">A</div>
      <h1 class="mt-4 text-2xl font-bold tracking-tight">Admin Panel</h1>
      <p class="text-slate-400 text-sm mt-1">Silakan masuk untuk melanjutkan</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-8 shadow-2xl">
      <form action="dashboard.html" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
          <input id="username" type="text" placeholder="Masukkan username"
            class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
          <input id="password" type="password" placeholder="Masukkan password"
            class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition" />
        </div>
        <button type="submit"
          class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold shadow-lg shadow-emerald-500/30 transition-colors">
          Login
        </button>
      </form>
    </div>

    <p class="text-center text-slate-500 text-xs mt-6">&copy; 2026 Admin Panel &middot; Tugas Lab Minggu 2</p>
  </div>
</body>
</html>
