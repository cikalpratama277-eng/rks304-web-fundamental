<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Produk - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 font-sans antialiased text-slate-800 flex">
  <!-- Navigasi (Sidebar) -->
  <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex">
    <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-800">
      <div class="w-9 h-9 rounded-xl bg-emerald-500 text-slate-900 font-black flex items-center justify-center">A</div>
      <span class="font-bold text-white">Admin Panel</span>
    </div>
    <nav class="flex-1 p-4 space-y-1">
      <a href="dashboard.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">Dashboard</a>
      <a href="products.html" class="block px-4 py-2.5 rounded-lg bg-slate-800 text-white transition">Products</a>
      <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">Users</a>
      <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">Setting</a>
    </nav>
    <div class="p-4 border-t border-slate-800">
      <a href="index.html" class="block text-center px-4 py-2.5 rounded-lg bg-slate-800 text-red-400 hover:bg-red-500 hover:text-white transition">Logout</a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-h-screen">
    <!-- Header -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0">
      <h2 class="font-semibold text-slate-700">Add Produk</h2>
      <div class="flex items-center gap-3">
        <span class="text-sm text-slate-500">Halo, Admin</span>
        <div class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center font-semibold">A</div>
      </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-1 p-8">
      <div class="flex items-center gap-3 mb-6">
        <a href="products.html" class="text-slate-400 hover:text-slate-700 transition">&larr; Kembali</a>
        <h1 class="text-2xl font-bold text-slate-800">Add Produk</h1>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 p-8 max-w-2xl">
        <form action="products.html" class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium text-slate-600 mb-2">Name</label>
            <input id="name" type="text" placeholder="Masukkan nama produk"
              class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition" />
          </div>
          <div>
            <label for="stock" class="block text-sm font-medium text-slate-600 mb-2">Stock</label>
            <input id="stock" type="number" placeholder="Masukkan jumlah stok"
              class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition" />
          </div>
          <div>
            <label for="description" class="block text-sm font-medium text-slate-600 mb-2">Description</label>
            <textarea id="description" rows="4" placeholder="Masukkan deskripsi produk"
              class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"></textarea>
          </div>
          <div class="flex gap-3">
            <button type="submit"
              class="px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold shadow-lg shadow-emerald-500/20 transition-colors">
              Submit
            </button>
            <a href="products.html" class="px-6 py-3 rounded-xl bg-slate-100 text-slate-600 font-semibold hover:bg-slate-200 transition">Batal</a>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 px-6 py-4 text-center text-sm text-slate-500">
      &copy; 2026 Admin Panel &middot; Tugas Lab Minggu 2
    </footer>
  </div>
</body>
</html>
